<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&display=swap');

        body {
            font-family: 'Josefin Sans', sans-serif;
        }

        .label {
            display: block;
            text-align: center;
        }

        .tulisan {
            text-align: center;
            margin: auto;
            border: 2px solid;
            width: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            }

        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            -webkit-transition: .4s;
            transition: .4s;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            -webkit-transition: .4s;
            transition: .4s;
        }

        input:checked + .slider {
            background-color: #2196f3;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #2196f3;
        }

        input:checked + .slider:before {
            -webkit-transform: translateX(26px);
            -ms-transform: translateX(26px);
            transform: translateX(26px);
        }

        body.dark-mode {
            background-color: #121212; 
            color: #ffffff;           
        }
    </style>
</head>
<body>
    <div class="tulisan">
        <h1>Universitas Sebelas Maret</h1>
        <h2>Pendidikan Teknik Informatika dan Komputer</h2>
    </div>
    <div class="label">
        <h1>Dark Mode</h1>
        <label class="switch">
            <input type="checkbox" onchange="ubahTema(event)">
            <span class="slider"></span>
        </label>
    </div>
</body>
<script>
    function ubahTema(event) {
    if (event.target.checked) {
        document.body.classList.add('dark-mode');
        
        localStorage.setItem('tema', 'dark');
    } else {
        document.body.classList.remove('dark-mode');
        
        localStorage.setItem('tema', 'light');
    }
}

    const switchToggle = document.querySelector('.switch input');
    const temaTersimpan = localStorage.getItem('tema');

    if (temaTersimpan === 'dark') {
        document.body.classList.add('dark-mode');
        switchToggle.checked = true; 
    }
</script>
</html>
