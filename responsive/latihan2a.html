<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desain Responsiv</title>
    
    <style>
        * {
            box-sizing: border-box;
        }

        #wrapper {
            margin: auto;
            width: 100%;
        }

        .header {
            height: 150px;
            padding: 20px;
            border: 2px solid red;
        }

        .nav {
            margin: auto;
            padding: 20px;
            height: auto;
            border: 2px solid red;
        }

        .menubox {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .box {
            display: flex;
            flex: 1 1 100%;
            height: 150px;
            background: red;
            border: 2px solid red;
            box-sizing: border-box;
        }

        .footer {
            padding: 20px;
            height: 120px;
            border: 2px solid red;
        }

        @media (min-width: 680px) {
            .box {
                flex: 1 1 calc(50% - 10px);
            }
        }

        @media (min-width: 1080px) {
            .box {
                flex: 1 1 calc(25% - 15px);
            }
        }

        
    </style>
</head>
<body>

    <div id="wrapper">
        <div class="header">
            <h2>Header</h2>
        </div>

        <div class="nav">
            <h2>Services</h2>
            <div class="menubox">
                <div class="box">Box 1</div>
                <div class="box">Box 2</div>
                <div class="box">Box 3</div>
                <div class="box">Box 4</div>
            </div>
        </div>

        <div class="footer">
            <h2>Footer</h2>
        </div>
    </div>
    
</body>
</html>
