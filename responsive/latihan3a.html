<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Transisi CSS3</title>

    <style>
        .box {
            width: 40%;
            height: 100px;
            background: orange;
            border: 2px solid #212121;
        }

        @media (orientation: landscape) {
            .box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <h3>Transisi CSS 3</h3>

    <div class="box"></div>
    <p>ubah orientasi ke landscape/potrait dan sebaliknya untuk melihat efek transis</p>
    
</body>
</html>
